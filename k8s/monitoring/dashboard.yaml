# Grafana подхватывает ConfigMap с меткой grafana_dashboard: "1" в namespace monitoring
apiVersion: v1
kind: ConfigMap
metadata:
  name: roi-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  roi.json: |
    {
      "uid": "roi-service",
      "title": "ROI service",
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "schemaVersion": 39,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Версия модели в подах",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count by (version) (roi_model_info)",
              "legendFormat": "{{version}}",
              "instant": true
            }
          ],
          "options": {
            "textMode": "value_and_name",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Запросы в секунду",
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_requests_total{handler=\"/v1/predict\"}[1m]))",
              "legendFormat": "rps",
              "instant": false
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Задержка p50 и p95",
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5, sum by (le) (rate(http_request_duration_seconds_bucket{handler=\"/v1/predict\"}[1m])))",
              "legendFormat": "p50",
              "instant": false
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{handler=\"/v1/predict\"}[1m])))",
              "legendFormat": "p95",
              "instant": false
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Распределение скора",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (le) (rate(roi_score_bucket[5m]))",
              "legendFormat": "{{le}}",
              "instant": false
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Доля положительного класса",
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(roi_predictions_total{positive_roi=\"1\"}[5m])) / sum(rate(roi_predictions_total[5m]))",
              "legendFormat": "positive share",
              "instant": false
            }
          ]
        }
      ]
    }
