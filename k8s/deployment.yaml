apiVersion: apps/v1
kind: Deployment
metadata:
  name: roi-service

spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingupdate: {maxUnavalible: 0, maxSurge: 1}
  selector:
    matchLabels:
      app: roi-service
  template:
    metadata:
      labels:
        app: roi-service
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: api
          image: roi-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: roi-service-config}
            - secretRef: {name: roi-service-secrets}
          startupProbe:
            httpGet: {path: /health, port: 8000}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          lifecycle:
            preStop:
              exec: {command: ["sh", "-c", "sleep 5"]}
