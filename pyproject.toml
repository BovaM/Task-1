[project]
name = "roi_service"
version="0.2.0"
description = "ML project"
requires-python=">=3.11, <3.13"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "pandas",
    "scikit-learn==1.9.1",
    "joblib",
    "psycopg[binary]",
    "mlflow-skinny>=3.16,<4",
    "skops>=0.11",
    "prometheus-client>=0.21",
    "prometheus-fastapi-instrumentator>=8",
]

[dependency-groups]
dev = [
    "pytest",
    "locust",
    "httpx",
    "ruff"
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "roi_service"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: нужна база данных - адрес в DATABASE_URL"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
