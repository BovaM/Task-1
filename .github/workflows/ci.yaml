name: ci

on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: roi_service}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/roi_service

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {enable-cache: true}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - name: тесты; интеграционные должны работать
        run: |
          OUT=$(uv run pytest -q --color=no 2>&1) || { echo "$OUT"; exit 1; }
          echo "$OUT"
          if echo "$OUT" | grep -q "skipped"; then
            echo "ОШИБКА: тесты пропущены в CI"
            exit 1
          fi

  build:
    needs: tests
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions: {contents: read, packages: write}

    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # джоба идёт не в облаке GitHub, а на runner в Docker на машине с kind
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, kind]
    concurrency: {group: deploy-kind}
    timeout-minutes: 10
    permissions: {contents: read, packages: read}

    env:
      KIND_CLUSTER: mlpro

    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: kind, kubectl и доступ к кластеру
        run: |
          B=~/.local/bin && mkdir -p $B && echo "$B" >> "$GITHUB_PATH"
          [ -x $B/kind ] || curl -sSLo $B/kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          [ -x $B/kubectl ] || curl -sSLo $B/kubectl https://dl.k8s.io/v1.37.0/bin/linux/amd64/kubectl
          chmod +x $B/kind $B/kubectl
          $B/kind export kubeconfig --name "$KIND_CLUSTER" --internal
          $B/kubectl get nodes

      - name: образ в кластер
        run: |
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name "$KIND_CLUSTER"

      - name: подтягиваем секреты
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          kubectl create secret generic roi-service-secrets \
          --from-literal=POSTGRES_PASSWORD="$DB_PASSWORD" \
          --from-literal=DATABASE_URL="postgresql://postgres:$DB_PASSWORD@postgres:5432/roi_service" \
          --dry-run=client -o yaml | kubectl apply -f -

      - name: база
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status deploy/postgres --timeout=180s

      - name: сервис
        run: |
          kubectl apply -f k8s/
          kubectl set image deploy/roi-service api="$IMAGE"
          kubectl rollout status deploy/roi-service --timeout=180s


      - name: мониторинг и DAG
        run: |
          kubectl apply -f k8s/monitoring/
          kubectl -n mlops create configmap airflow-dags --from-file=dags/ \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n mlops exec deploy/airflow -- airflow variables set roi_image "$IMAGE"

      - name: jq для smoke (на self-hosted runner его может не быть)
        run: |
          if ! command -v jq >/dev/null; then
            if ! { apt-get update && apt-get install -y jq; }; then
              curl -sSLo /usr/local/bin/jq https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64
              chmod +x /usr/local/bin/jq
            fi
          fi

      - name: smoke
        # через Ingress, как ходят пользовател - из сети kind узел виден по имени, Traefik слушает NodePort 30080
        run: |
          U="http://$KIND_CLUSTER-control-plane:30080"; H="Host: roi.localhost"
          CHAMPION=$(curl --fail -s -H "Host: mlflow.localhost" "$U/api/2.0/mlflow/registered-models/alias?name=roi&alias=champion" | jq -r .model_version.version)
          echo "champion в реестре: $CHAMPION"

          curl --fail -s -H "$H" "$U/health" -o health.json
          cat health.json; echo
          jq -e --arg v "$CHAMPION" '(.model_version | tostring) == $v' health.json >/dev/null

          curl --fail -s -X POST -H "$H" -H "Content-Type: application/json" -d @good.json "$U/v1/predict" | tee pred.json; echo
          jq -e '.score >= 0 and .score <= 1 and (.positive_roi == 0 or .positive_roi == 1)' pred.json >/dev/null

          curl --fail -s -H "$H" "$U/metrics" | grep -q "^roi_model_info{version=\"$CHAMPION\""

          sleep 2
          RID=$(jq -r .request_id pred.json)
          kubectl exec deploy/postgres -- psql -U postgres -d roi_service -tAc "SELECT count(*) FROM predictions WHERE request_id = '$RID'" | grep -qx 1